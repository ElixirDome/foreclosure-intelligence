name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-and-security:
    name: Backend Unit & Security
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_unit.db
      JWT_SECRET_KEY: ci-secret-key-32-bytes-minimum-length-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit & Security Tests
        run: |
          python -m pytest -m "unit or security" -v --durations=10

  backend-integration-and-migrations:
    name: Backend Integration & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: foreclosure_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/foreclosure_test_db
      JWT_SECRET_KEY: ci-secret-key-32-bytes-minimum-length-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Alembic Single Head & Migrations
        run: |
          alembic heads
          alembic upgrade head
      - name: Run Integration & Migration Tests
        run: |
          python -m pytest tests/test_api_integration.py tests/test_migrations_and_integrity.py tests/test_reliability_recovery.py -v

  frontend-quality:
    name: Frontend Quality & Components
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck TypeScript
        run: npm run typecheck
      - name: Run Vitest Component Tests
        run: npm test
      - name: Verify Production Build
        run: npm run build

  e2e-playwright-smoke:
    name: E2E Playwright Smoke
    needs: [frontend-quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  k6-performance-smoke:
    name: k6 Performance Smoke
    needs: [backend-unit-and-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 Smoke Scenario
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/smoke.js
          flags: --vus 2 --duration 5s
        env:
          BASE_URL: https://httpbin.org

[pytest]
pythonpath = .
testpaths = tests
markers =
    unit: Fast pure business logic and helper unit tests
    integration: API and database integration tests
    security: Authentication, authorization, SSRF, and input validation security tests
    migration: Alembic migration chain and schema integrity tests
    reliability: Network failure, retry, concurrency, and fault tolerance tests
    performance: Throughput, latency, and resource efficiency tests
    slow: Tests that take longer than 1 second to run
